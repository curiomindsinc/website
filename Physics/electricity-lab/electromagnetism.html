<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">

<title>Electromagnetism &amp; Induction — Electricity Lab</title>

<!-- Curiominds Electricity Lab · Mr Lau Chin Hang / @curiominds.inc · Self-contained: works offline, no external requests, no data collected. No third-party libraries are included. -->
<style>/* Curiominds Electricity Lab — shared shell. System fonts only (offline). */
:root{
--cream:#faf9f5; --navy:#141413; --coral:#d97757; --magenta:#c41e7e;
--panel:#ffffff; --ink:#141413; --muted:#5f5e58; --line:#e3e0d6; --soft:#f1efe8;
--ok:#1f7a4a; --okbg:#e6f3ec; --bad:#b4332a; --badbg:#fbeae8; --warn:#9a5b00; --warnbg:#fff3df;
--coral-ink:#a8492c; --radius:12px;
--shadow:0 1px 2px rgba(20,20,19,.06),0 6px 18px rgba(20,20,19,.06);
--fs:16px;
}
html.projector{--fs:19px}
*{box-sizing:border-box}
html,body,#app{margin:0;height:100%}
body{background:var(--cream);color:var(--ink);font:var(--fs)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
a{color:var(--coral-ink)}
:focus-visible{outline:3px solid var(--magenta);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---------- app frame ---------- */
.app{display:flex;flex-direction:column;height:100%;min-height:0}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 14px;background:var(--navy);color:var(--cream)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-height:44px}
.brand svg{flex:0 0 auto}
.brand b{font-size:1.02em;letter-spacing:-.01em}
.brand small{display:block;font-size:.72em;opacity:.75;font-weight:500}
.simnav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.simnav a{white-space:nowrap;color:var(--cream);text-decoration:none;font-size:.82em;font-weight:600;padding:0 12px;min-height:40px;display:flex;align-items:center;border-radius:999px;opacity:.82}
.simnav a:hover{opacity:1;background:rgba(250,249,245,.1)}
.simnav a[aria-current]{opacity:1;background:var(--coral);color:var(--navy)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.toolbar .spacer{flex:1}
.flowlabel{font-size:.82em;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.flowlabel i{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;color:#fff;font-size:12px;font-weight:800}
.seg{display:inline-flex;background:var(--soft);padding:3px;border-radius:999px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:650;font-size:.86em;padding:0 14px;min-height:38px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.seg.tabs button[aria-pressed=true]{background:var(--navy);color:var(--cream)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);font-weight:650;font-size:.9em;border-radius:10px;padding:0 14px;min-height:44px;min-width:44px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:#cfcabd}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--cream)}
.btn.coral{background:var(--coral);border-color:var(--coral);color:var(--navy)}
.btn.small{min-height:36px;padding:0 10px;font-size:.82em}
.btn:disabled{opacity:.45;cursor:not-allowed}
main.work{flex:1 1 auto;min-height:0;display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:220px minmax(0,1fr) 380px;gap:12px;padding:12px}
main.work.sandbox{grid-template-columns:minmax(0,1fr) 300px}
.chapters{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px;overflow:auto}
.chapters h2,.panel h2.cap{font-size:.72em;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:4px 6px 8px}
.chapters ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.chapters button{width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:8px 10px;min-height:44px;cursor:pointer;display:flex;gap:8px;align-items:flex-start;font-size:.9em;line-height:1.3}
.chapters button .n{font-weight:800;color:var(--coral-ink);min-width:1.2em}
.chapters button .done{margin-left:auto;color:var(--ok);font-weight:800}
.chapters button[aria-current=true]{background:var(--soft);font-weight:700}
.chapters select{display:none}
.stage{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-height:0;display:flex;flex-direction:column}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;padding:14px 16px;min-height:0}
.panel h1{font-size:1.25em;margin:0 0 2px;letter-spacing:-.01em}
.panel .syl{font-size:.75em;color:var(--muted);margin-bottom:10px}
.panel p{margin:.5em 0}
.panel .formula{font-family:Cambria,"Times New Roman",serif;font-size:1.15em;background:var(--soft);border-radius:8px;padding:6px 12px;display:inline-block;margin:4px 0}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 12px}
.steps button{flex:1 1 auto;border:1px solid var(--line);background:var(--panel);border-radius:10px;min-height:44px;font-size:.8em;font-weight:700;cursor:pointer;padding:0 8px;color:var(--muted)}
.steps button[aria-current=true]{background:var(--navy);color:var(--cream);border-color:var(--navy)}
.steps button .tick{color:var(--ok)}
.steps button[aria-current=true] .tick{color:#8fe0b4}
.stepnav{display:flex;justify-content:space-between;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.attrib{font-size:.78em;color:var(--muted);padding:4px 14px 6px;text-align:center;background:var(--cream);line-height:1.35}
.attrib b{color:var(--ink)}
.credit .credit-links{margin-top:1px}
.credit .credit-links a{color:var(--coral-ink);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;min-height:36px;padding:0 4px}
.credit .credit-links a:hover{text-decoration:underline}
@media (pointer:coarse){.credit .credit-links a{min-height:44px}}
/* ---------- controls ---------- */
.ctl{margin:10px 0}
.ctl .lab{display:flex;justify-content:space-between;gap:8px;font-size:.86em;color:var(--muted)}
.ctl .lab output{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.ctl input[type=range]{width:100%;height:44px;margin:0;accent-color:var(--coral);touch-action:pan-y}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;background:var(--panel)}
.card.soft{background:var(--soft);border-color:transparent}
.note{font-size:.86em;color:var(--muted)}
.callout{border-left:4px solid var(--coral);background:#fbf1ec;padding:8px 12px;border-radius:0 8px 8px 0;margin:10px 0;font-size:.92em}
.callout.mis{border-color:var(--magenta);background:#fbecf4}
.callout.mis b:first-child{color:var(--magenta)}
.verdict{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;border-radius:8px;margin:8px 0;font-size:.92em}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.bad{background:var(--badbg);color:var(--bad)}
.verdict.wait{background:var(--soft);color:var(--muted)}
.verdict .ic{font-weight:900}
.readings{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin:8px 0}
.reading{background:var(--soft);border-radius:8px;padding:6px 10px}
.reading small{display:block;font-size:.72em;color:var(--muted);font-weight:650}
.reading b{font-variant-numeric:tabular-nums;font-size:1.08em}
table.rec{border-collapse:collapse;width:100%;font-size:.86em;margin:8px 0;font-variant-numeric:tabular-nums}
table.rec th,table.rec td{border:1px solid var(--line);padding:5px 8px;text-align:center}
table.rec th{background:var(--soft);font-weight:700}
/* predict-then-test */
.ptt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.ptt>div{border-radius:10px;padding:8px 12px;border:2px solid var(--line)}
.ptt h4{margin:0 0 4px;font-size:.72em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ptt .you{border-color:var(--magenta)}
.ptt .res{border-color:var(--navy)}
.ptt b{font-size:1.05em}
.choices{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.choices button{text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;min-height:44px;cursor:pointer;font-size:.92em}
.choices button[aria-pressed=true]{border-color:var(--magenta);background:#fbecf4;font-weight:650}
.choices button.right{border-color:var(--ok);background:var(--okbg)}
.choices button.wrong{border-color:var(--bad);background:var(--badbg)}
.choices button:disabled{cursor:default}
.numin{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}
.numin input{width:130px;min-height:44px;border:2px solid var(--line);border-radius:10px;padding:0 10px}
/* questions */
.q{border-top:1px solid var(--line);padding:12px 0}
.q:first-of-type{border-top:0}
.q .qh{display:flex;gap:8px;font-size:.92em}
.q .qn{font-weight:800;color:var(--coral-ink)}
.q .marks{margin-left:auto;font-size:.78em;color:var(--muted);white-space:nowrap}
.q .model{background:var(--soft);border-radius:8px;padding:8px 12px;font-size:.88em;margin-top:6px}
.q textarea{width:100%;min-height:70px;border:2px solid var(--line);border-radius:10px;padding:8px;font:inherit;font-size:.9em}
/* board overlay */
.stage,.palette,.zoombar{-webkit-user-select:none;user-select:none}
.boardwrap{position:relative;flex:1 1 auto;min-height:0}
.boardwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.zoombar{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zoombar .btn{min-height:40px;min-width:40px;padding:0;font-size:1.1em;box-shadow:var(--shadow)}
.banner{pointer-events:none;position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:min(92%,560px);z-index:4;padding:8px 14px;border-radius:10px;font-size:.88em;box-shadow:var(--shadow);display:none}
.banner.show{display:block}
.banner.short{background:var(--badbg);color:var(--bad);border:2px solid var(--bad)}
.banner.open{background:var(--warnbg);color:var(--warn);border:2px solid #e9b765}
.banner.info{background:var(--panel);color:var(--ink);border:2px solid var(--line)}
.palette{display:flex;gap:6px;overflow-x:auto;padding:8px;border-top:1px solid var(--line);background:var(--cream);flex:0 0 auto;scrollbar-width:thin}
.palette button{flex:0 0 auto;width:70px;min-height:64px;border:1px solid var(--line);background:var(--panel);border-radius:10px;cursor:grab;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.66em;font-weight:650;color:var(--muted);touch-action:none;padding:4px 2px}
.palette button canvas{width:56px;height:30px;pointer-events:none}
.palette .hint{flex:0 0 auto;align-self:center;font-size:.72em;color:var(--muted);max-width:160px;line-height:1.25}
.inspector{position:absolute;left:8px;bottom:8px;z-index:3;width:min(300px,calc(100% - 16px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;display:none;max-height:calc(100% - 16px);overflow:auto}
.inspector.show{display:block}
.inspector.docked{position:static;width:auto;max-height:none;border-radius:0;border-width:1px 0 0;box-shadow:none;flex:0 0 auto}
.inspector h3{margin:0;font-size:.95em;display:flex;align-items:center;gap:8px}
.inspector h3 .x{margin-left:auto}
.inspector .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ghost{position:fixed;pointer-events:none;z-index:50;opacity:.85}
/* plot */
.plotbox{position:relative;width:100%;height:220px}
.plotbox canvas{position:absolute;inset:0;width:100%;height:100%}
/* touch: every target at least 44 px */
@media (pointer:coarse){.seg button,.btn.small,.steps button{min-height:44px}.simnav a{min-height:44px}}
/* responsive */
@media (max-width:1100px){
main.work{grid-template-columns:minmax(0,1fr) 340px}
main.work .chapters{grid-column:1 / -1;padding:6px}
.chapters ol,.chapters h2{display:none}
.chapters select{display:block;width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--panel)}
}
@media (max-width:760px), (orientation:portrait) and (max-width:900px){
.app,#app{height:auto;min-height:100%}
main.work,main.work.sandbox{display:flex;flex-direction:column;padding:8px;gap:8px}
.stage{min-height:340px;flex:0 0 auto}
.stage>.boardwrap{height:58vh;min-height:320px;flex:0 0 auto}
.panel{overflow:visible}
.simnav{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap}
.toolbar{gap:6px;padding:6px 8px;font-size:.88em}
.seg button{padding:0 10px}
.toolbar .projbtn{display:none}
.topbar{padding:6px 10px;gap:6px}
.brand small{display:none}
.flowlabel{width:100%;order:9}
.ptt{grid-template-columns:1fr}
.banner{font-size:.78em;padding:6px 10px;top:6px;max-width:calc(100% - 70px);left:8px;transform:none}
}
@media (max-height:520px) and (orientation:landscape){
.app{height:auto}
.stage{height:86vh}
main.work{grid-template-columns:minmax(0,1fr) 320px}
}
@media print{
.topbar,.toolbar,.palette,.zoombar{display:none}
}
</style>
