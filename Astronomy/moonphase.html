<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Moon Phase Simulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; font-family: 'Segoe UI', Arial, sans-serif; color:#e8e8f0; }
  #scene-container { position:fixed; inset:0; }
  #panel {
    position:fixed; top:16px; left:16px; width:320px;
    background:rgba(10,12,24,0.72); backdrop-filter: blur(6px);
    border:1px solid rgba(255,255,255,0.12); border-radius:12px;
    padding:16px 18px; box-shadow:0 8px 30px rgba(0,0,0,0.5);
  }
  #panel h1 { font-size:16px; margin:0 0 12px; letter-spacing:0.5px; color:#cfd6ff; }
  #panel label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:#9aa3c7; margin:12px 0 4px; }
  #panel input[type="date"], #panel select {
    width:100%; box-sizing:border-box; background:#12142a; color:#e8e8f0;
    border:1px solid rgba(255,255,255,0.15); border-radius:6px; padding:6px 8px; font-size:13px;
  }
  #panel input[type="range"] { width:100%; margin-top:4px; accent-color:#8fa2ff; }
  .playRow { display:flex; gap:8px; margin-top:10px; align-items:center; }
  #playBtn {
    background:#2a3060; color:#e8e8f0; border:1px solid rgba(255,255,255,0.18);
    border-radius:6px; padding:6px 12px; font-size:13px; cursor:pointer; white-space:nowrap;
  }
  #playBtn:hover { background:#363d7a; }
  #speedSelect { flex:1; }
  #info { margin-top:16px; border-top:1px solid rgba(255,255,255,0.12); padding-top:12px; font-size:13px; line-height:1.7; }
  #info .phase-name { font-size:18px; font-weight:600; color:#fff; }
  #info .row { display:flex; justify-content:space-between; color:#c4cbea; }
  #info .row span:last-child { color:#fff; font-weight:500; }
  #credit { position:fixed; bottom:10px; right:14px; font-size:10px; color:#6b7299; }

  #recenterBtn {
    position:fixed; top:16px; right:16px; z-index:5;
    background:rgba(10,12,24,0.72); color:#e8e8f0; border:1px solid rgba(255,255,255,0.18);
    border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer; backdrop-filter: blur(6px);
  }
  #recenterBtn:hover { background:rgba(30,34,60,0.85); }

  #orrery-panel {
    position:fixed; bottom:16px; right:16px; width:400px;
    background:rgba(10,12,24,0.72); backdrop-filter: blur(6px);
    border:1px solid rgba(255,255,255,0.12); border-radius:12px;
    padding:10px; box-shadow:0 8px 30px rgba(0,0,0,0.5);
  }
  #orrery-panel h2 { font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:#9aa3c7; margin:0 0 6px; }
  #orrery-container { position:relative; width:380px; height:310px; }
  #orrery-container canvas { display:block; border-radius:8px; }
  .orrery-label {
    position:absolute; transform:translate(-50%, -50%); font-size:11px; font-weight:600;
    color:#fff; text-shadow:0 0 4px #000, 0 0 2px #000; pointer-events:none; white-space:nowrap;
  }
  #orreryAngle { margin-top:6px; font-size:11px; color:#c4cbea; text-align:center; }
</style>
</head>
<body>

<div id="scene-container"></div>

<button id="recenterBtn">⟲ Recenter View</button>

<div id="orrery-panel">
  <h2>Sun · Earth · Moon geometry</h2>
  <div id="orrery-container"></div>
  <div id="orreryAngle">Elongation: —</div>
</div>

<div id="panel">
  <h1>🌙 Moon Phase Simulator</h1>

  <label for="datePicker">Date</label>
  <input type="date" id="datePicker" />

  <input type="range" id="dateSlider" min="0" max="73000" step="1" />

  <div class="playRow">
    <button id="playBtn">▶ Play</button>
    <select id="speedSelect">
      <option value="1">Slow (1 day/s)</option>
      <option value="3" selected>Normal (3 days/s)</option>
      <option value="7">Fast (7 days/s)</option>
    </select>
  </div>

  <label for="countrySelect">Country</label>
  <select id="countrySelect"></select>

  <div id="info">
    <div class="phase-name" id="phaseName">—</div>
    <div class="row"><span>Illumination</span><span id="illumination">—</span></div>
    <div class="row"><span>Local date/time</span><span id="localTime">—</span></div>
    <div class="row"><span>Moonrise</span><span id="moonrise">—</span></div>
    <div class="row"><span>Moonset</span><span id="moonset">—</span></div>
  </div>
</div>

<div id="credit">Drag to rotate · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2/astronomy.browser.min.js"></script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ---------------------------------------------------------------------------
// Country data: name, capital lat/lon, IANA timezone id. Real timezone (not a
// fixed offset) so DST is handled correctly year-round via the Intl API.
// ---------------------------------------------------------------------------
const COUNTRIES = [
  { name: "United States (Washington DC)", lat: 38.9,  lon: -77.0,  tz: "America/New_York" },
  { name: "United Kingdom (London)",       lat: 51.5,  lon: -0.1,   tz: "Europe/London" },
  { name: "France (Paris)",                lat: 48.9,  lon: 2.35,   tz: "Europe/Paris" },
  { name: "Germany (Berlin)",              lat: 52.5,  lon: 13.4,   tz: "Europe/Berlin" },
  { name: "Spain (Madrid)",                lat: 40.4,  lon: -3.7,   tz: "Europe/Madrid" },
  { name: "Italy (Rome)",                  lat: 41.9,  lon: 12.5,   tz: "Europe/Rome" },
  { name: "Russia (Moscow)",               lat: 55.75, lon: 37.6,   tz: "Europe/Moscow" },
  { name: "Turkey (Ankara)",               lat: 39.9,  lon: 32.85,  tz: "Europe/Istanbul" },
  { name: "Egypt (Cairo)",                 lat: 30.0,  lon: 31.2,   tz: "Africa/Cairo" },
  { name: "Nigeria (Abuja)",               lat: 9.1,   lon: 7.5,    tz: "Africa/Lagos" },
  { name: "South Africa (Pretoria)",       lat: -25.7, lon: 28.2,   tz: "Africa/Johannesburg" },
  { name: "Kenya (Nairobi)",               lat: -1.3,  lon: 36.8,   tz: "Africa/Nairobi" },
  { name: "Saudi Arabia (Riyadh)",         lat: 24.7,  lon: 46.7,   tz: "Asia/Riyadh" },
  { name: "United Arab Emirates (Dubai)",  lat: 25.2,  lon: 55.3,   tz: "Asia/Dubai" },
  { name: "India (New Delhi)",             lat: 28.6,  lon: 77.2,   tz: "Asia/Kolkata" },
  { name: "Pakistan (Islamabad)",          lat: 33.7,  lon: 73.1,   tz: "Asia/Karachi" },
  { name: "Bangladesh (Dhaka)",            lat: 23.8,  lon: 90.4,   tz: "Asia/Dhaka" },
  { name: "Thailand (Bangkok)",            lat: 13.75, lon: 100.5,  tz: "Asia/Bangkok" },
  { name: "Vietnam (Hanoi)",               lat: 21.0,  lon: 105.85, tz: "Asia/Ho_Chi_Minh" },
  { name: "Singapore",                     lat: 1.35,  lon: 103.8,  tz: "Asia/Singapore" },
  { name: "Indonesia (Jakarta)",           lat: -6.2,  lon: 106.8,  tz: "Asia/Jakarta" },
  { name: "Philippines (Manila)",          lat: 14.6,  lon: 121.0,  tz: "Asia/Manila" },
  { name: "China (Beijing)",               lat: 39.9,  lon: 116.4,  tz: "Asia/Shanghai" },
  { name: "Japan (Tokyo)",                 lat: 35.7,  lon: 139.7,  tz: "Asia/Tokyo" },
  { name: "South Korea (Seoul)",           lat: 37.55, lon: 126.98, tz: "Asia/Seoul" },
  { name: "Australia (Canberra)",          lat: -35.3, lon: 149.1,  tz: "Australia/Sydney" },
  { name: "New Zealand (Wellington)",      lat: -41.3, lon: 174.8,  tz: "Pacific/Auckland" },
  { name: "Canada (Ottawa)",               lat: 45.4,  lon: -75.7,  tz: "America/Toronto" },
  { name: "Mexico (Mexico City)",          lat: 19.4,  lon: -99.1,  tz: "America/Mexico_City" },
  { name: "Brazil (Brasília)",             lat: -15.8, lon: -47.9,  tz: "America/Sao_Paulo" },
  { name: "Argentina (Buenos Aires)",      lat: -34.6, lon: -58.4,  tz: "America/Argentina/Buenos_Aires" },
  { name: "Chile (Santiago)",              lat: -33.45,lon: -70.65, tz: "America/Santiago" },
  { name: "Peru (Lima)",                   lat: -12.05,lon: -77.05, tz: "America/Lima" },
  { name: "Colombia (Bogotá)",             lat: 4.7,   lon: -74.1,  tz: "America/Bogota" },
  { name: "Norway (Oslo)",                 lat: 59.9,  lon: 10.75,  tz: "Europe/Oslo" },
  { name: "Sweden (Stockholm)",            lat: 59.3,  lon: 18.1,   tz: "Europe/Stockholm" },
  { name: "Iceland (Reykjavik)",           lat: 64.15, lon: -21.9,  tz: "Atlantic/Reykjavik" },
  { name: "Netherlands (Amsterdam)",       lat: 52.35, lon: 4.9,    tz: "Europe/Amsterdam" },
  { name: "Poland (Warsaw)",               lat: 52.25, lon: 21.0,   tz: "Europe/Warsaw" },
  { name: "Greece (Athens)",               lat: 38.0,  lon: 23.7,   tz: "Europe/Athens" },
];

const countrySelect = document.getElementById("countrySelect");
COUNTRIES.forEach((c, i) => {
  const opt = document.createElement("option");
  opt.value = i;
  opt.textContent = c.name;
  countrySelect.appendChild(opt);
});
countrySelect.value = 1; // default: United Kingdom

// ---------------------------------------------------------------------------
// Three.js scene
// ---------------------------------------------------------------------------
const container = document.getElementById("scene-container");
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4;
controls.maxDistance = 20;

const DEFAULT_CAM_POS = new THREE.Vector3(0, 0, 8);
const DEFAULT_TARGET = new THREE.Vector3(0, 0, 0);
document.getElementById("recenterBtn").addEventListener("click", () => {
  camera.position.copy(DEFAULT_CAM_POS);
  controls.target.copy(DEFAULT_TARGET);
  controls.update();
});

// starfield
{
  const starGeo = new THREE.BufferGeometry();
  const starCount = 2000;
  const positions = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    const r = 80 + Math.random() * 400;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);
  }
  starGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.6, sizeAttenuation: true });
  scene.add(new THREE.Points(starGeo, starMat));
}

// hemisphereGroup flips crescent orientation for Southern-hemisphere countries
const hemisphereGroup = new THREE.Object3D();
scene.add(hemisphereGroup);

// moon mesh
const textureLoader = new THREE.TextureLoader();
const moonTexture = textureLoader.load("https://raw.githubusercontent.com/curiomindsinc/moonphase/main/assets/moon_texture.jpg");
const moonGeometry = new THREE.SphereGeometry(2, 96, 96);
const moonMaterial = new THREE.MeshStandardMaterial({
  map: moonTexture,
  roughness: 1,
  metalness: 0,
});
const moonMesh = new THREE.Mesh(moonGeometry, moonMaterial);
moonMesh.rotation.y = Math.PI / 2; // align texture's prime meridian to camera-facing side
hemisphereGroup.add(moonMesh);

// very dim ambient so the night side isn't pure black (readability)
scene.add(new THREE.AmbientLight(0x223355, 0.15));

// sun light rotates around the moon on a pivot; pivot angle = phase elongation
const lightPivot = new THREE.Object3D();
hemisphereGroup.add(lightPivot);
const sunLight = new THREE.DirectionalLight(0xfff6e8, 1.6);
sunLight.position.set(0, 0, -12); // at rotation 0 (elong 0 / New Moon) light sits behind the moon, opposite the camera
lightPivot.add(sunLight);

// ---------------------------------------------------------------------------
// Mini orrery: schematic (not to scale) top-down-ish view of Sun/Earth/Moon
// showing the real geometry that produces the current phase. Sun is fixed
// along +X; Moon sits on its orbit ring at the elongation angle returned by
// Astronomy.MoonPhase() — elong=0 -> Moon between Earth & Sun (New Moon),
// elong=180 -> Moon opposite the Sun (Full Moon).
// ---------------------------------------------------------------------------
const ORRERY_W = 380, ORRERY_H = 310;
const SUN_DIST = 3.6, ORBIT_R = 1.4;

const orreryContainer = document.getElementById("orrery-container");
const scene2 = new THREE.Scene();
const camera2 = new THREE.PerspectiveCamera(40, ORRERY_W / ORRERY_H, 0.1, 100);
camera2.position.set(0, 3.2, 5.2);
camera2.lookAt(0, 0, 0);

const renderer2 = new THREE.WebGLRenderer({ antialias: true });
renderer2.setPixelRatio(window.devicePixelRatio);
renderer2.setSize(ORRERY_W, ORRERY_H);
renderer2.setClearColor(0x060a18, 1);
orreryContainer.appendChild(renderer2.domElement);

scene2.add(new THREE.AmbientLight(0x8899bb, 0.6));

// soft glow halo behind the Sun (radial-gradient sprite, additive blend)
function makeGlowTexture() {
  const size = 128;
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const ctx = c.getContext("2d");
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0, "rgba(255,240,200,1)");
  g.addColorStop(0.4, "rgba(255,210,120,0.55)");
  g.addColorStop(1, "rgba(255,180,60,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlowTexture(), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
}));
sunGlow.scale.set(2.2, 2.2, 1);

// light cone: solid wedge from the Sun sweeping across the lit half of the
// orbit, matching classic phase-diagram illustrations
const coneMat = new THREE.MeshBasicMaterial({
  color: 0xffe9a8, transparent: true, opacity: 0.16, side: THREE.DoubleSide,
  depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,
});
const conePts = [
  new THREE.Vector3(SUN_DIST - 0.25, 0, 0),
  new THREE.Vector3(-ORBIT_R * 0.9, 0, ORBIT_R * 1.35),
  new THREE.Vector3(-ORBIT_R * 0.9, 0, -ORBIT_R * 1.35),
];
const coneGeo = new THREE.BufferGeometry().setFromPoints(conePts);
coneGeo.setIndex([0, 1, 2]);
coneGeo.computeVertexNormals();
const lightCone = new THREE.Mesh(coneGeo, coneMat);
lightCone.position.y = -0.01;
lightCone.renderOrder = -1; // draw first, as a background wash — solid bodies (Earth/Sun/Moon) always render on top
scene2.add(lightCone);

// orbit ring
{
  const pts = [];
  for (let i = 0; i <= 64; i++) {
    const t = (i / 64) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(t) * ORBIT_R, 0, Math.sin(t) * ORBIT_R));
  }
  const ringGeo = new THREE.BufferGeometry().setFromPoints(pts);
  scene2.add(new THREE.LineLoop(ringGeo, new THREE.LineBasicMaterial({ color: 0x556088 })));
}

const earthTexture = textureLoader.load("https://raw.githubusercontent.com/curiomindsinc/moonphase/main/assets/earth_texture.jpg");
const earthMesh = new THREE.Mesh(
  new THREE.SphereGeometry(0.35, 32, 32),
  new THREE.MeshStandardMaterial({ map: earthTexture, roughness: 0.8 })
);
scene2.add(earthMesh);

const sunMesh = new THREE.Mesh(
  new THREE.SphereGeometry(0.3, 32, 32),
  new THREE.MeshStandardMaterial({ color: 0xffcc33, emissive: 0xffaa00, emissiveIntensity: 1.2 })
);
sunMesh.position.set(SUN_DIST, 0, 0);
sunMesh.add(sunGlow);
scene2.add(sunMesh);
scene2.add(new THREE.PointLight(0xfff6e0, 2.2, 0, 0)); // decay 0: no distance falloff, keeps Earth/Moon evenly bright

const moonOrreryMesh = new THREE.Mesh(
  new THREE.SphereGeometry(0.16, 32, 32),
  new THREE.MeshStandardMaterial({ map: moonTexture, roughness: 1 })
);
scene2.add(moonOrreryMesh);

// animated sun rays: dashed lines showing light travelling Sun -> Earth and Sun -> Moon
const sunRayMaterial = new THREE.LineDashedMaterial({
  color: 0xfff2c4, dashSize: 0.1, gapSize: 0.07, transparent: true, opacity: 0.95,
  linewidth: 2,
});
const sunToEarthRay = new THREE.Line(new THREE.BufferGeometry(), sunRayMaterial);
const sunToMoonRay = new THREE.Line(new THREE.BufferGeometry(), sunRayMaterial);
scene2.add(sunToEarthRay, sunToMoonRay);

function setRayPoints(line, from, to) {
  line.geometry.setFromPoints([from, to]);
  line.computeLineDistances();
}

const sunLabel = document.createElement("div");
sunLabel.className = "orrery-label";
sunLabel.textContent = "Sun";
const earthLabel = document.createElement("div");
earthLabel.className = "orrery-label";
earthLabel.textContent = "Earth";
const moonLabel = document.createElement("div");
moonLabel.className = "orrery-label";
moonLabel.textContent = "Moon";
orreryContainer.appendChild(sunLabel);
orreryContainer.appendChild(earthLabel);
orreryContainer.appendChild(moonLabel);

function projectToOrrery(vec3) {
  const v = vec3.clone().project(camera2);
  return { x: (v.x * 0.5 + 0.5) * ORRERY_W, y: (-v.y * 0.5 + 0.5) * ORRERY_H };
}

function updateOrrery(elongDeg) {
  const rad = THREE.MathUtils.degToRad(elongDeg);
  moonOrreryMesh.position.set(Math.cos(rad) * ORBIT_R, 0, Math.sin(rad) * ORBIT_R);

  setRayPoints(sunToEarthRay, sunMesh.position, earthMesh.position);
  setRayPoints(sunToMoonRay, sunMesh.position, moonOrreryMesh.position);

  const sp = projectToOrrery(sunMesh.position);
  const ep = projectToOrrery(earthMesh.position);
  const mp = projectToOrrery(moonOrreryMesh.position);
  sunLabel.style.left = `${sp.x}px`; sunLabel.style.top = `${sp.y - 14}px`;
  earthLabel.style.left = `${ep.x}px`; earthLabel.style.top = `${ep.y - 14}px`;
  moonLabel.style.left = `${mp.x}px`; moonLabel.style.top = `${mp.y - 12}px`;

  document.getElementById("orreryAngle").textContent = `Elongation: ${Math.round(elongDeg)}°`;
}

// ---------------------------------------------------------------------------
// Astronomy + UI wiring
// ---------------------------------------------------------------------------
const datePicker = document.getElementById("datePicker");
const dateSlider = document.getElementById("dateSlider");
const playBtn = document.getElementById("playBtn");
const speedSelect = document.getElementById("speedSelect");
const SLIDER_MAX_DAY = Number(dateSlider.max);

const EPOCH = Date.UTC(1900, 0, 1); // slider day 0
const MS_PER_DAY = 86400000;

// ---------------------------------------------------------------------------
// Timezone helpers: real IANA-zone offsets via Intl (DST-correct year round),
// no library needed.
// ---------------------------------------------------------------------------
function tzOffsetMinutes(date, timeZone) {
  const parts = {};
  for (const p of new Intl.DateTimeFormat("en-US", {
    timeZone, hour12: false, year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
  }).formatToParts(date)) parts[p.type] = p.value;
  let hour = Number(parts.hour);
  if (hour === 24) hour = 0;
  const asUTC = Date.UTC(Number(parts.year), Number(parts.month) - 1, Number(parts.day), hour, Number(parts.minute), Number(parts.second));
  return (asUTC - date.getTime()) / 60000;
}
function localWallTimeToUtc(y, monthIndex0, day, hour, minute, timeZone) {
  const guessUtc = Date.UTC(y, monthIndex0, day, hour, minute, 0);
  const offsetMin = tzOffsetMinutes(new Date(guessUtc), timeZone);
  return new Date(guessUtc - offsetMin * 60000);
}
function formatInZone(utcDate, timeZone) {
  return new Intl.DateTimeFormat("en-US", {
    timeZone, month: "2-digit", day: "2-digit", year: "numeric",
    hour: "numeric", minute: "2-digit", hour12: true, timeZoneName: "shortOffset",
  }).format(utcDate);
}

function dateToSliderValue(d) {
  return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - EPOCH) / MS_PER_DAY);
}
function sliderValueToDate(v) {
  return new Date(EPOCH + v * MS_PER_DAY);
}
function pad(n) { return String(n).padStart(2, "0"); }
function dateToInputValue(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

const today = new Date();
datePicker.value = dateToInputValue(today);
dateSlider.value = dateToSliderValue(today);

function phaseName(elongDeg) {
  const a = ((elongDeg % 360) + 360) % 360;
  const tol = 4;
  if (a < tol || a > 360 - tol) return "New Moon";
  if (Math.abs(a - 90) < tol) return "First Quarter";
  if (Math.abs(a - 180) < tol) return "Full Moon";
  if (Math.abs(a - 270) < tol) return "Last Quarter";
  if (a < 90) return "Waxing Crescent";
  if (a < 180) return "Waxing Gibbous";
  if (a < 270) return "Waning Gibbous";
  return "Waning Crescent";
}

// Cheap per-frame path: phase angle + 3D rotation + orrery. No timezone or
// rise/set lookups here — those're only needed once per simulated day.
function updateAstronomyLight(utcInstant) {
  const elong = Astronomy.MoonPhase(utcInstant);           // 0-360 deg
  const illum = Astronomy.Illumination(Astronomy.Body.Moon, utcInstant);
  const illumPct = Math.round(illum.phase_fraction * 100);

  document.getElementById("phaseName").textContent = phaseName(elong);
  document.getElementById("illumination").textContent = `${illumPct}%`;

  lightPivot.rotation.y = THREE.MathUtils.degToRad(elong);
  updateOrrery(elong);
  return elong;
}

// Full path: everything above plus timezone-correct local time and
// moonrise/moonset (numerical search — only worth doing once per day change).
function updateFull() {
  const country = COUNTRIES[Number(countrySelect.value)];
  const [y, m, d] = datePicker.value.split("-").map(Number);

  const utcInstant = localWallTimeToUtc(y, m - 1, d, 12, 0, country.tz);
  updateAstronomyLight(utcInstant);

  document.getElementById("localTime").textContent = formatInZone(utcInstant, country.tz);

  const observer = new Astronomy.Observer(country.lat, country.lon, 0);
  const localMidnightUtc = localWallTimeToUtc(y, m - 1, d, 0, 0, country.tz);
  let riseText = "—", setText = "—";
  try {
    const rise = Astronomy.SearchRiseSet(Astronomy.Body.Moon, observer, +1, localMidnightUtc, 1);
    if (rise) riseText = formatInZone(rise.date, country.tz);
  } catch (e) {}
  try {
    const set = Astronomy.SearchRiseSet(Astronomy.Body.Moon, observer, -1, localMidnightUtc, 1);
    if (set) setText = formatInZone(set.date, country.tz);
  } catch (e) {}
  document.getElementById("moonrise").textContent = riseText;
  document.getElementById("moonset").textContent = setText;

  // hemisphere flip: Southern-hemisphere observers see the moon "upside down"
  hemisphereGroup.rotation.z = country.lat < 0 ? Math.PI : 0;
}

function stopPlaying() {
  if (!isPlaying) return;
  isPlaying = false;
  playBtn.textContent = "▶ Play";
}

datePicker.addEventListener("input", () => {
  stopPlaying();
  dateSlider.value = dateToSliderValue(new Date(datePicker.value));
  updateFull();
});
dateSlider.addEventListener("input", () => {
  stopPlaying();
  datePicker.value = dateToInputValue(sliderValueToDate(Number(dateSlider.value)));
  updateFull();
});
countrySelect.addEventListener("change", () => {
  stopPlaying();
  updateFull();
});

// ---------------------------------------------------------------------------
// Play / animate
// ---------------------------------------------------------------------------
let isPlaying = false;
let playSpeedDaysPerSec = Number(speedSelect.value);
let simDayFloat = Number(dateSlider.value);
let lastWholeDay = Math.floor(simDayFloat);

speedSelect.addEventListener("change", () => {
  playSpeedDaysPerSec = Number(speedSelect.value);
});

playBtn.addEventListener("click", () => {
  isPlaying = !isPlaying;
  if (isPlaying) {
    simDayFloat = Number(dateSlider.value);
    lastWholeDay = Math.floor(simDayFloat);
  }
  playBtn.textContent = isPlaying ? "⏸ Pause" : "▶ Play";
});

updateFull();

// ---------------------------------------------------------------------------
// Render loop
// ---------------------------------------------------------------------------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);

  const dt = clock.getDelta();
  const t = clock.getElapsedTime();
  sunRayMaterial.dashOffset -= dt * 0.6;
  coneMat.opacity = 0.13 + Math.sin(t * 1.2) * 0.03;

  if (isPlaying) {
    simDayFloat += dt * playSpeedDaysPerSec;
    if (simDayFloat >= SLIDER_MAX_DAY) {
      simDayFloat = SLIDER_MAX_DAY;
      isPlaying = false;
      playBtn.textContent = "▶ Play";
    }
    // smooth per-frame phase animation (UTC noon reference, tz precision not
    // needed for the animated rotation itself)
    updateAstronomyLight(new Date(EPOCH + simDayFloat * MS_PER_DAY + 12 * 3600000));

    const wholeDay = Math.floor(simDayFloat);
    if (wholeDay !== lastWholeDay) {
      lastWholeDay = wholeDay;
      dateSlider.value = wholeDay;
      datePicker.value = dateToInputValue(sliderValueToDate(wholeDay));
      updateFull();
    }
  }

  renderer2.render(scene2, camera2);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
